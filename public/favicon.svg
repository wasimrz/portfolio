<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Squircle with smooth shadow -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#borderGrad)" stroke-width="2.5" stroke-opacity="0.85"/>
  
  <!-- Sleek Code Monogram WR -->
  <text 
    x="31" 
    y="41" 
    font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" 
    font-size="25" 
    font-weight="800" 
    fill="#f8fafc" 
    text-anchor="middle" 
    letter-spacing="-0.8px"
  >WR</text>
  
  <!-- Live Status Accent Dot -->
  <circle cx="51" cy="15" r="4.5" fill="#38bdf8"/>
  <circle cx="51" cy="15" r="2.5" fill="#ffffff"/>
</svg>
